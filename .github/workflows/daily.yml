name: Daily DeepSearch

on:
  push:
    branches: [main]
  schedule:
    # Start at Beijing 07:37 (UTC 23:37) so collection/build normally
    # finishes near 08:00, while avoiding GitHub's congested top-of-hour queue.
    - cron: "37 23 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: deepsearch-daily
  cancel-in-progress: true

jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Run pipeline tests
        run: PYTHONPATH=. python tests/test_pipeline.py

      - name: Collect and analyze papers
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-v4-flash' }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m deepsearch.main

      - name: Build static site
        run: |
          npm ci
          npm run build:pages

      - name: Persist the 365-day archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/papers.json docs
          if ! git diff --cached --quiet; then
            git commit -m "Update daily research digest [skip ci]"
            git push
          fi

      - uses: actions/configure-pages@v6
        if: vars.ENABLE_GITHUB_PAGES == 'true'
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        if: vars.ENABLE_GITHUB_PAGES == 'true'
        with:
          path: docs

      - name: Deploy GitHub Pages
        if: vars.ENABLE_GITHUB_PAGES == 'true'
        id: deployment
        uses: actions/deploy-pages@v5
