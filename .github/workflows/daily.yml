name: Daily DeepSearch

on:
  push:
    branches: [main]
  schedule:
    # Beijing 04:37 (UTC 20:37). GitHub's scheduled queue is heavily delayed
    # (measured 2.5-3.5h late on this repo), so an early request lands the
    # actual run in the Beijing morning instead of near noon.
    - cron: "37 20 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: deepsearch-daily
  cancel-in-progress: true

jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Run pipeline tests
        run: PYTHONPATH=. python tests/test_pipeline.py

      - name: Collect and analyze papers
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-v4-flash' }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m deepsearch.main

      - name: Build static site
        run: |
          npm ci
          npm run build:pages

      - name: Persist the cumulative archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/papers.json docs
          if ! git diff --cached --quiet; then
            git commit -m "Update daily research digest [skip ci]"
            git push
          fi

      - uses: actions/configure-pages@v6
        if: vars.ENABLE_GITHUB_PAGES == 'true'
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        if: vars.ENABLE_GITHUB_PAGES == 'true'
        with:
          path: docs

      - name: Deploy GitHub Pages
        if: vars.ENABLE_GITHUB_PAGES == 'true'
        id: deployment
        uses: actions/deploy-pages@v5

      # A silent failure is worse than a loud one: the pipeline once failed on
      # nine consecutive days and nobody noticed. File an issue (deduplicated
      # against an existing open report) so failures surface in the repo.
      - name: Report failure as an issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing=$(gh issue list --label pipeline-failure --state open --limit 1 --json number --jq '.[0].number')
          body="每日更新流水线失败。\n\n- 运行记录：${RUN_URL}\n- 触发方式：${{ github.event_name }}\n- 失败原因见运行日志；若连续失败，站点会在页头显示数据陈旧提示。"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$(printf "$body")"
          else
            gh issue create --title "每日更新流水线失败" --label pipeline-failure --body "$(printf "$body")"
          fi
