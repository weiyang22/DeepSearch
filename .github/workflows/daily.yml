name: Daily DeepSearch

on:
  push:
    branches: [main]
  schedule:
    # Beijing 04:37 (UTC 20:37). GitHub's scheduled queue is heavily delayed
    # (measured 2.5-3.5h late on this repo), so an early request lands the
    # actual run in the Beijing morning instead of near noon.
    - cron: "37 20 * * *"
  workflow_dispatch:
    inputs:
      probe_alert:
        description: "自检：只触发失败告警链路，用于验证告警本身是否可用"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: deepsearch-daily
  cancel-in-progress: true

jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Run pipeline tests
        run: PYTHONPATH=. python tests/test_pipeline.py

      - name: Collect and analyze papers
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-v4-flash' }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m deepsearch.main

      - name: Build static site
        run: |
          npm ci
          npm run build:pages

      - name: Persist the cumulative archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/papers.json docs
          if ! git diff --cached --quiet; then
            git commit -m "Update daily research digest [skip ci]"
            git push
          fi

      - uses: actions/configure-pages@v6
        if: vars.ENABLE_GITHUB_PAGES == 'true'
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        if: vars.ENABLE_GITHUB_PAGES == 'true'
        with:
          path: docs

      - name: Deploy GitHub Pages
        if: vars.ENABLE_GITHUB_PAGES == 'true'
        id: deployment
        uses: actions/deploy-pages@v5

      # A silent failure is worse than a loud one: the pipeline once failed on
      # A silent failure is worse than a loud one: the pipeline once failed on
      # nine consecutive days and nobody noticed. File an issue (deduplicated
      # against an existing open report) so failures surface in the repo.
      #
      # continue-on-error plus `|| true` on every call: the alerter must never
      # become a second failure. The first version did - the label did not
      # exist yet, `gh issue create --label` aborted, and no report was filed.
      # An alarm that is never tested is not an alarm - the first version of
      # this step failed silently on a missing label. Dispatch the workflow
      # with probe_alert=true to exercise the reporting path deliberately.
      - name: Report failure as an issue
        if: failure() || inputs.probe_alert == true
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create pipeline-failure --color B60205 \
            --description "每日更新流水线失败" 2>/dev/null || true
          body="$(printf '每日更新流水线失败。\n\n- 运行记录：%s\n- 触发方式：%s\n- 失败步骤与原因见运行日志；若连续失败，站点页头会显示数据陈旧提示。' "$RUN_URL" "${{ github.event_name }}")"
          existing=$(gh issue list --label pipeline-failure --state open --limit 1 \
            --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body" || true
          else
            gh issue create --title "每日更新流水线失败" --label pipeline-failure --body "$body" || \
            gh issue create --title "每日更新流水线失败" --body "$body" || true
          fi
