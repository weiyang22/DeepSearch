[site]
title = "LLM&GR"
subtitle = "大模型 · 生成式推荐 · Semantic ID 技术雷达"
timezone = "Asia/Shanghai"
# 0 表示不设数量上限；每日入选数量由时间窗口和质量分决定。
daily_limit = 0
daily_window_days = 3
daily_min_score = 45
retention_days = 365

[discovery]
# LLM 只保留企业参与/官方发布；GenRec 必须有明确 A/B 或线上受控实验。
require_enterprise_llm = true
require_ab_genrec = true
arxiv_categories = ["cs.AI", "cs.CL", "cs.LG", "cs.IR"]
topic_queries = [
  "large language model pretraining",
  "foundation model technical report",
  "large language model post-training alignment",
  "large language model architecture scaling",
  "generative recommendation",
  "generative retrieval",
  "semantic ID recommendation",
  "semantic identifier recommendation"
]
include_keywords = [
  "large language model",
  "llm",
  "foundation model",
  "base model",
  "pretraining",
  "pre-training",
  "post-training",
  "alignment",
  "rlhf",
  "mixture of experts",
  "scaling law",
  "generative recommendation",
  "generative recommender",
  "generative retrieval",
  "semantic id",
  "semantic identifier",
  "semantic token",
  "item tokenization",
  "recommendation"
]
exclude_keywords = [
  "survey",
  "benchmarking chatgpt for",
  "llm-as-a-judge for recommendation"
]
enterprise_keywords = [
  "Alibaba", "Amazon", "Apple", "ByteDance", "Google", "Google DeepMind", "DeepMind", "Huawei", "JD.com",
  "Kuaishou", "Meituan", "Meta", "Microsoft", "Netflix", "NVIDIA", "Pinterest",
  "Shopee", "Snap", "Tencent", "TikTok", "Xiaomi", "Yahoo"
]
arxiv_max_results = 300
openalex_per_query = 50
semantic_scholar_limit = 30
official_github_per_org = 100

[companies.queries]
Kimi = ["Kimi", "Moonshot AI", "Kimi Team", "MoonshotAI"]
DeepSeek = ["DeepSeek", "DeepSeek-AI", "DeepSeek AI"]
MiniMax = ["MiniMax AI", "MiniMaxAI", "MiniMax Team"]
"智谱" = ["Zhipu AI", "Z.ai", "GLM Team", "THUDM", "ChatGLM"]
"Google DeepMind" = ["Google DeepMind", "DeepMind", "GoogleDeepMind"]

[companies.github_orgs]
DeepSeek = "deepseek-ai"
Kimi = "MoonshotAI"
MiniMax = "MiniMax-AI"
"智谱" = "zai-org"
"Google DeepMind" = "google-deepmind"

[llm]
base_url = "https://api.deepseek.com"
model = "deepseek-v4-flash"
