[site]
title = "LLM&GR"
subtitle = "大模型 · 生成式推荐 · Semantic ID 技术雷达"
timezone = "Asia/Shanghai"
daily_limit = 4
retention_days = 90

[discovery]
arxiv_categories = ["cs.AI", "cs.CL", "cs.LG", "cs.IR"]
topic_queries = [
  "large language model recommendation",
  "generative recommendation",
  "generative retrieval",
  "semantic ID recommendation",
  "semantic identifier recommendation",
  "LLM recommender system"
]
include_keywords = [
  "large language model",
  "llm",
  "generative recommendation",
  "generative recommender",
  "generative retrieval",
  "semantic id",
  "semantic identifier",
  "semantic token",
  "item tokenization",
  "recommendation"
]
exclude_keywords = []
semantic_scholar_limit = 12

[companies.queries]
Kimi = ["Kimi", "Moonshot AI", "Kimi Team", "MoonshotAI"]
